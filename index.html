<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiting Hub - Entry Portal</title>
    <style>
        :root {
            --madison-green: #006847; /* Kelly Green */
            --madison-gold: #FFD700;  /* Yellow Gold */
            --dark-accent: #1a1a1a;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: url('Gemini_Generated_Image_h3kiiih3kiiih3ki.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 6px solid var(--madison-green);
        }

        /* This is the class that keeps the huge image in check */
        .hero-logo {
            width: 160px; /* Bumped up slightly since this logo is landscape format */
            height: auto;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            color: var(--dark-accent);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        p {
            color: #555;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .launch-btn {
            display: inline-block;
            text-decoration: none;
            background: var(--madison-green);
            color: white;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 104, 71, 0.2);
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
            box-shadow: 0 6px 12px rgba(0, 104, 71, 0.3);
        }

        .footer-text {
            margin-top: 40px;
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="welcome-card">
    <img src="https://resources.finalsite.net/images/f_auto,q_auto/v1719002553/dallasisdorg/deadxy1dlos5tabu87lt/madisonloglandscape.jpg" alt="Madison Logo" class="hero-logo">
    
    <h1>Welcome to the Recruiting Hub</h1>
    <p>Access College Coaching Staffs, Social Media links, and College Camps</p>
    
    <a href="College_Search_Tool_-_beta__2__update_3_.html" class="launch-btn">Launch College Search Tool</a>
    
    <div class="footer-text">
        &copy; 2026 James Madison Football
    </div>
</div>

</body>
</html>
